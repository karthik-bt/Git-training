<!DOCTYPE html>
<html>
<head>
    <title>Flight Booking</title>
</head>
<body>
    <h1>Book a Flight</h1>
    <form>
        <label>Passenger Name:</label>
        <input type="text" id="passengerName" placeholder="Enter your name" /><br><br>

        <label>Flight Number:</label>
        <input type="text" id="flightNumber" placeholder="e.g. AI-202" /><br><br>

        <label>Travel Date:</label>
        <input type="date" id="travelDate" /><br><br>

        <label>Seat Number:</label>
        <input type="text" id="seatNumber" placeholder="e.g. 12A" /><br><br>

        <button type="button" onclick="bookFlight()">Book Now</button>
    </form>
    <script src="booking.js"></script>
</body>
</html>
